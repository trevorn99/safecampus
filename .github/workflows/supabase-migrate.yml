name: Deploy Supabase migrations

on:
  push:
    branches: [dev, main]
  workflow_dispatch:

concurrency:
  group: supabase-migrate-${{ github.ref }}
  cancel-in-progress: false

jobs:
  migrate:
    runs-on: ubuntu-latest
    # main -> the "production" GitHub Environment, dev -> the "dev" one.
    # Each environment holds its own SUPABASE_PROJECT_ID / SUPABASE_DB_PASSWORD,
    # so this same job pushes to the right Supabase project per branch.
    environment: ${{ github.ref == 'refs/heads/main' && 'production' || 'dev' }}
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          # Pinned, not "latest". This job broke once because a CLI release
          # landed between runs and changed what `supabase link` required —
          # same repo, same secrets, green one evening and failing the next
          # morning. Bump this deliberately.
          version: 2.117.0

      # No `supabase link` step: it authenticates against a Management API
      # endpoint this job doesn't otherwise need, and it was the only thing
      # failing. `migration list` and `db push` both take --project-ref, which
      # also makes the target visible in the command rather than in link state
      # written to disk by an earlier step.
      - name: Migration status
        run: supabase migration list --project-ref "$SUPABASE_PROJECT_ID"
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}

      - name: Push migrations
        run: supabase db push --project-ref "$SUPABASE_PROJECT_ID"
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
