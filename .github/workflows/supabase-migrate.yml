name: Deploy Supabase migrations

on:
  push:
    branches: [dev, main]
  workflow_dispatch:

concurrency:
  group: supabase-migrate-${{ github.ref }}
  cancel-in-progress: false

jobs:
  migrate:
    runs-on: ubuntu-latest
    # main -> the "production" GitHub Environment, dev -> the "dev" one.
    # Each environment holds its own SUPABASE_PROJECT_ID / SUPABASE_DB_PASSWORD,
    # so this same job pushes to the right Supabase project per branch.
    environment: ${{ github.ref == 'refs/heads/main' && 'production' || 'dev' }}
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          # Pinned, not "latest". This job broke once because a CLI release
          # landed between runs and changed what `supabase link` required —
          # same repo, same secrets, green one evening and failing the next
          # morning. Bump this deliberately.
          version: 2.117.0

      # Connects by URL rather than by project reference, which sidesteps
      # both ways this job has broken.
      #
      # --project-ref alone makes the CLI open a direct database connection,
      # and those are IPv6-only; GitHub runners have no IPv6, so it fails
      # with "IPv6 is not supported on your current network". The documented
      # remedy is `supabase link`, which resolves and caches the IPv4 pooler
      # URL — but link calls the Management API, needs SUPABASE_ACCESS_TOKEN,
      # and that token is what broke this job twice: once revoked, once
      # expired, each time silently until a migration was needed.
      #
      # A pooler URL is IPv4 and needs no Management API call, so there is no
      # token to expire and nothing to link. SUPABASE_DB_URL is the Session
      # pooler connection string from Supabase: Project Settings > Database >
      # Connection string > Session pooler, with the password filled in and
      # percent-encoded if it contains punctuation.
      - name: Check the connection string is set
        run: |
          if [ -z "$SUPABASE_DB_URL" ]; then
            echo "SUPABASE_DB_URL is not set for this environment."
            echo "Add it as an environment secret: Supabase > Project Settings >"
            echo "Database > Connection string > Session pooler, password filled in."
            exit 1
          fi
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}

      - name: Migration status
        run: supabase migration list --db-url "$SUPABASE_DB_URL"
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}

      - name: Push migrations
        run: supabase db push --db-url "$SUPABASE_DB_URL"
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
