name: Deploy Supabase migrations

on:
  push:
    branches: [dev, main]
  workflow_dispatch:

concurrency:
  group: supabase-migrate-${{ github.ref }}
  cancel-in-progress: false

jobs:
  migrate:
    runs-on: ubuntu-latest
    # main -> the "production" GitHub Environment, dev -> the "dev" one.
    # Each environment holds its own SUPABASE_PROJECT_ID / SUPABASE_DB_PASSWORD,
    # so this same job pushes to the right Supabase project per branch.
    environment: ${{ github.ref == 'refs/heads/main' && 'production' || 'dev' }}
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          # Pinned, not "latest". This job broke once because a CLI release
          # landed between runs and changed what `supabase link` required —
          # same repo, same secrets, green one evening and failing the next
          # morning. Bump this deliberately.
          version: 2.117.0

      # `link` is back, and this time it's load-bearing for a different
      # reason than before. Supabase's direct database connections are
      # IPv6-only and GitHub runners have no IPv6, so --project-ref alone
      # fails with "IPv6 is not supported on your current network" — linking
      # is what resolves and caches the IPv4 pooler URL the job then uses.
      #
      # It was removed in September because it failed on a Management API
      # privileges error. That may have been a CLI-side problem since fixed;
      # if it returns, the fallback is --db-url with the pooler connection
      # string, which needs no Management API call at all.
      - name: Link project
        run: supabase link --project-ref "$SUPABASE_PROJECT_ID"
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}

      - name: Migration status
        run: supabase migration list --project-ref "$SUPABASE_PROJECT_ID"
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}

      - name: Push migrations
        run: supabase db push --project-ref "$SUPABASE_PROJECT_ID"
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
